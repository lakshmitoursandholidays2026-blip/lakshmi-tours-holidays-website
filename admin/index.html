async function upload(bucket,file){
 const type=(file.type||"").toLowerCase();
 if(!/^image\/(jpeg|png|webp|heic|heif)$/.test(type) && !type.startsWith("image/"))throw new Error("Use a valid image file");
 if(file.size>10*1024*1024)throw new Error("Image is over 10 MB");
 const loadImage=(source)=>new Promise((resolve,reject)=>{const url=URL.createObjectURL(source);const image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("This image could not be processed. Please try another photo."))};image.src=url});
 let blob=file; let contentType=type||"image/jpeg"; let extension=".jpg";
 if(!/^image\/(jpeg|png|webp)$/i.test(type)){
  const image=await loadImage(file);
  const width=image.naturalWidth||image.width;const height=image.naturalHeight||image.height;const scale=Math.min(1,1800/Math.max(width,height));
  const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));const ctx=canvas.getContext("2d");if(!ctx)throw new Error("This browser could not process the selected photo.");ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const converted=await new Promise((resolve)=>{canvas.toBlob(resolve,"image/jpeg",.88)});
  if(!converted)throw new Error("This browser could not convert the selected photo. Please choose a JPEG, PNG, or WebP image.");
  blob=converted;contentType="image/jpeg";extension=".jpg";
 }
 if(blob.type&&/^image\/(jpeg|png|webp)$/i.test(blob.type)){contentType=blob.type;extension=blob.type==="image/png"?".png":blob.type==="image/webp"?".webp":".jpg";}
 const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}${extension}`;
 const r=await db.storage.from(bucket).upload(path,blob,{contentType,upsert:false});if(r.error)throw r.error;return path;
}

    const deleted=await db.from(k).delete().eq("id",row.id);
    if(deleted.error)return toast("Photo removal failed: "+deleted.error.message,1);
    if(row.image_path){const removed=await db.storage.from(c.bucket).remove([row.image_path]);if(removed.error){console.error("Photo record was removed, but its image file could not be deleted:",removed.error);toast("Photo removed, but its image file could not be deleted: "+removed.error.message,1)}}
    toast("Photo removed");d.close();done();return;
   }
   for(const f of c.fields)if(f.req&&(values[f.k]==null||values[f.k]===""))return toast(f.l+" is required",1);
   if(c.slug){
    const source=String(values[c.slug]||"");
    values.slug=row&&source===row[c.slug]?row.slug:await uniqueSlug(k,slugify(source),row?.id);
   }
   const query=isNew?db.from(k).insert(values).select().single():db.from(k).update(values).eq("id",row.id).select().single();
   const result=await query;
   if(result.error){
    const message=result.error.code==="23505"?"That name is already in use. Change the name and try again.":result.error.message;
    return toast("Save failed: "+message,1);
   }
   const removedPaths=c.fields.filter(f=>f.t==="image"&&row?.[f.k]&&row[f.k]!==values[f.k]).map(f=>row[f.k]);
   if(removedPaths.length){const removed=await db.storage.from(c.bucket).remove(removedPaths);if(removed.error){console.error("Record saved, but previous image files could not be removed:",removed.error);toast("Saved, but previous image files could not be removed: "+removed.error.message,1)}}
   for(const f of c.fields.filter(field=>field.t==="image"))if(values[f.k])uploadedPaths.delete(values[f.k]);
   toast("Saved");
   if(isNew&&(c.child||c.child2)){row=result.data;$("#ef h2").textContent="Edit "+c.label;kids(c,row,uploadedPaths)}else d.close();
   done();
  }catch(error){toast("Save failed: "+error.message,1)}
  finally{saveButton.disabled=false}
 };
}
